name: nmtaskboard

services:
  postgres:
    image: postgres:16-alpine
    platform: linux/amd64
    pull_policy: never
    environment:
      POSTGRES_USER: nmtaskboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先设置 POSTGRES_PASSWORD}
      POSTGRES_DB: nmtaskboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nmtaskboard -d nmtaskboard"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    image: nmtaskboard:2.0.0
    platform: linux/amd64
    pull_policy: never
    init: true
    ports:
      - "${PORT:-3301}:3301"
    environment:
      HOST: 0.0.0.0
      PORT: "3301"
      NODE_ENV: production
      DATA_DIR: /app/data
      DATABASE_URL: postgres://nmtaskboard:${POSTGRES_PASSWORD}@postgres:5432/nmtaskboard
      DATABASE_SCHEMA: nmtaskboard
      SESSION_SECURE: ${SESSION_SECURE:-false}
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app_data:
  postgres_data:
