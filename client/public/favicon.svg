<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>牛马任务看板</title>
  <defs>
    <linearGradient id="glass" x1="9" y1="6" x2="55" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#E7EEF2" stop-opacity=".42"/>
      <stop offset="1" stop-color="#AFC0C9" stop-opacity=".56"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientTransform="translate(16 16) rotate(44) scale(36)">
      <stop stop-color="#B89BB1" stop-opacity=".88"/>
      <stop offset="1" stop-color="#B89BB1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientTransform="translate(50 50) rotate(-132) scale(40)">
      <stop stop-color="#6E879B" stop-opacity=".9"/>
      <stop offset="1" stop-color="#6E879B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barBlue" x1="14" y1="13" x2="30" y2="49" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DDF0FF" stop-opacity=".9"/>
      <stop offset=".4" stop-color="#7398B8" stop-opacity=".8"/>
      <stop offset="1" stop-color="#486B89" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="barViolet" x1="29" y1="21" x2="41" y2="49" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2E9F2" stop-opacity=".9"/>
      <stop offset="1" stop-color="#8C748D" stop-opacity=".84"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#243844" flood-opacity=".34"/>
    </filter>
    <filter id="barShadow" x="-40%" y="-30%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#263D4B" flood-opacity=".3"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="3" y="3" width="58" height="58" rx="16" fill="#B6C2C8" fill-opacity=".58"/>
    <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#violetGlow)"/>
    <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#blueGlow)"/>
    <rect x="3.75" y="3.75" width="56.5" height="56.5" rx="15.25" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity=".84" stroke-width="1.5"/>
    <path d="M12 7.5h31.5c7.2 0 13 5.8 13 13" fill="none" stroke="#FFFFFF" stroke-opacity=".66" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <g filter="url(#barShadow)">
    <rect x="13" y="16" width="11" height="33" rx="3.5" fill="url(#barBlue)" stroke="#FFFFFF" stroke-opacity=".72"/>
    <rect x="27" y="24" width="11" height="25" rx="3.5" fill="url(#barViolet)" stroke="#FFFFFF" stroke-opacity=".68"/>
    <rect x="41" y="12" width="11" height="15" rx="3.5" fill="#FFFFFF" fill-opacity=".62" stroke="#FFFFFF" stroke-opacity=".9"/>
    <path d="M16.5 18.5h4" stroke="#FFFFFF" stroke-opacity=".78" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M30.5 26.5h4" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M44.5 14.5h4" stroke="#FFFFFF" stroke-opacity=".82" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
